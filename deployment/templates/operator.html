<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conservation Monitor</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --bg-color: #0d0d0d;
            --panel-bg: #1a1a1a;
            --border-color: #333;
            --text-main: #e0e0e0;
            --accent-blue: #0078d7;
            --alert-red: #d32f2f;
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--bg-color); color: var(--text-main);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex; flex-direction: column; overflow: hidden;
        }

        header {
            background-color: var(--panel-bg); padding: 15px 20px;
            border-bottom: 1px solid var(--border-color); display: flex;
            justify-content: space-between; align-items: center;
        }

        .brand i { color: #888; }

        .main-container {
            flex: 1; min-height: 0; display: grid;
            grid-template-columns: 7fr 3fr; gap: 2px; background-color: var(--border-color);
        }

        .simulated-feed {
            width: 100%; height: 100%; position: relative;
            background-color: #000; display: flex;
            justify-content: center; align-items: center;
        }

        .sidebar {
            background-color: var(--panel-bg); display: flex;
            flex-direction: column; min-height: 0; height: 100%;
            padding: 15px; gap: 15px; overflow-y: auto;
        }

        .info-card {
            background-color: #222; border: 1px solid var(--border-color);
            border-radius: 6px; padding: 15px;
        }

        .status-clear { color: #4caf50; font-weight: bold; font-size: 1.2rem; }
        .status-alert { color: var(--alert-red); font-weight: bold; font-size: 1.2rem; animation: pulse 1.5s infinite; }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        /* SNAPSHOT PANEL */
        .snapshot-container {
            width: 100%; height: 200px; background-color: #000;
            border: 1px solid var(--border-color); border-radius: 4px;
            display: flex; justify-content: center; align-items: center;
            overflow: hidden; color: #555; position: relative;
        }
        .snapshot-container img { width: 100%; height: 100%; object-fit: cover; display: none; }
        
        /* REFRESH BUTTON OVERLAY */
        .btn-refresh-img {
            position: absolute; bottom: 10px; right: 10px;
            background-color: rgba(0, 0, 0, 0.7); color: #fff;
            border: 1px solid #555; border-radius: 4px;
            padding: 6px 12px; font-size: 0.8rem; cursor: pointer;
            display: none; transition: background 0.2s;
        }
        .btn-refresh-img:hover { background-color: var(--accent-blue); border-color: var(--accent-blue); }

        #map { width: 100%; height: 250px; border-radius: 4px; border: 1px solid var(--border-color); }

        footer {
            height: 70px; background-color: var(--panel-bg); 
            border-top: 1px solid var(--border-color);
            display: flex; align-items: center; padding: 0 20px; 
            gap: 15px; position: relative; z-index: 9999;
        }
        .btn {
            padding: 12px 24px; border: none; border-radius: 4px; font-weight: bold;
            font-family: 'Roboto', sans-serif; cursor: pointer; text-transform: uppercase;
            display: flex; align-items: center; gap: 10px; transition: all 0.2s;
        }
        .btn-start { background-color: var(--accent-blue); color: #fff; }
        .btn-stop { background-color: var(--alert-red); color: #fff; }
        .btn-export { background-color: transparent; color: var(--accent-blue); border: 1px solid var(--accent-blue); }
    </style>
</head>
<body>

    <header>
        <div style="font-size: 1.2rem; font-weight: bold;">
            <i class="fa-solid fa-shield-halved"></i> CONSERVATION MONITOR
        </div>
        <div style="color: #888;">Sector: Kereita Forest Reserve</div>
    </header>

    <div class="main-container">
        <div class="simulated-feed">
            <img id="live-feed" src="" crossorigin="anonymous" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain;" alt="Awaiting Video Signal...">
        </div>

        <div class="sidebar">
            
            <div class="info-card" id="threat-panel">
                <div style="color: #aaa; margin-bottom: 5px; font-size: 0.9rem;">CURRENT STATUS</div>
                <div id="status-text" class="status-clear"><i class="fa-solid fa-check-circle"></i> AREA SECURE</div>
                <div id="threat-details" style="display: none; margin-top: 10px; border-top: 1px solid #444; padding-top: 10px;">
                    <div><strong>Detected Tool:</strong> <span id="detected-tool">Chainsaw/Axe</span></div>
                    <div><strong>Time:</strong> <span id="detected-time">--:--:--</span></div>
                </div>
            </div>

            <div class="info-card">
                <div style="color: #aaa; margin-bottom: 10px; font-size: 0.9rem;"><i class="fa-solid fa-camera"></i> CONFIRMATION IMAGE</div>
                <div class="snapshot-container">
                    <span id="snapshot-placeholder">No recent threats</span>
                    <img id="snapshot-img" src="">
                    <button id="refresh-img-btn" class="btn-refresh-img" onclick="manualRefreshSnapshot()" title="Capture a fresh frame from the live feed">
                        <i class="fa-solid fa-camera-rotate"></i> Retake
                    </button>
                </div>
            </div>

            <div class="info-card">
                <div style="color: #aaa; margin-bottom: 10px; font-size: 0.9rem;"><i class="fa-solid fa-map-location-dot"></i> INCIDENT LOCATION</div>
                <div id="map"></div>
            </div>

        </div>
    </div>

    <footer>
        <button class="btn btn-start" onclick="startMission()"><i class="fa-solid fa-play"></i> START MISSION</button>
        <button class="btn btn-stop" onclick="stopMission()"><i class="fa-solid fa-ban"></i> STOP MISSION</button>
        <div style="flex: 1;"></div> 
        <button class="btn btn-export" onclick="generateReport()"><i class="fa-solid fa-file-pdf"></i> GENERATE INCIDENT REPORT</button>
    </footer>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map, marker;
        let threatAlreadyLogged = false;

        window.onload = function() {
            map = L.map('map').setView([-0.395, 36.680], 14);
            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                attribution: 'Tiles &copy; Esri'
            }).addTo(map);
        };

        function startMission() {
            fetch('/start_mission', { 
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ role: 'operator' })
            });
            setTimeout(() => {
                document.getElementById('live-feed').src = "http://127.0.0.1:5001/video_transmit";
            }, 8000); 
        }

        function stopMission() {
            fetch('/stop_mission', { 
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ role: 'operator' })
            })
            .then(response => {
                if(response.status === 403) {
                    alert("COMMAND OVERRIDE DENIED: This mission was initiated by the Primary Control Station. You do not have permission to abort.");
                    throw new Error("Permission Denied");
                }
                return response.json();
            })
            .then(data => {
                document.getElementById('live-feed').src = "";
                resetUI();
            })
            .catch(err => console.log(err));
        }

        function updateDashboard() {
            fetch('http://127.0.0.1:5001/telemetry_transmit')
                .then(response => response.json())
                .then(data => {
                    if (data.threat_active) {
                        document.getElementById('status-text').className = "status-alert";
                        document.getElementById('status-text').innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> ILLEGAL THREAT CONFIRMED';
                        document.getElementById('threat-details').style.display = "block";
                        
                        const lastLog = data.logs[data.logs.length - 1];
                        if(lastLog && lastLog.includes("THREAT CONFIRMED")) {
                            document.getElementById('detected-time').innerText = lastLog.substring(1, 9);
                            if(lastLog.includes("AXE")) document.getElementById('detected-tool').innerText = "Axe";
                            if(lastLog.includes("CHAINSAW")) document.getElementById('detected-tool').innerText = "Chainsaw";
                        }

                        // Latch the first image. It will never change unless the operator clicks "Retake"
                        if (!threatAlreadyLogged) {
                            threatAlreadyLogged = true; 
                            captureSnapshot();
                            dropMapPin();
                        }
                    } 
                })
                .catch(err => {});
        }

        async function captureSnapshot() {
            try {
                const timestamp = new Date().getTime();
                const response = await fetch("http://127.0.0.1:5001/capture_image?t=" + timestamp);
                
                if (response.ok) {
                    const blob = await response.blob();
                    const reader = new FileReader();
                    
                    reader.onloadend = function() {
                        const base64data = reader.result;
                        document.getElementById('snapshot-placeholder').style.display = "none";
                        document.getElementById('snapshot-img').src = base64data;
                        document.getElementById('snapshot-img').style.display = "block";
                        document.getElementById('refresh-img-btn').style.display = "block"; // Show the Retake button
                    }
                    reader.readAsDataURL(blob);
                }
            } catch (error) {
                console.error("[System] Snapshot capture failed:", error);
            }
        }

        // Dedicated function for the Retake button
        function manualRefreshSnapshot() {
            // Provide slight visual feedback so the user knows it clicked
            document.getElementById('snapshot-img').style.opacity = "0.5";
            captureSnapshot().then(() => {
                document.getElementById('snapshot-img').style.opacity = "1.0";
            });
        }

        function dropMapPin() {
            if (marker) map.removeLayer(marker);
            const latOffset = (Math.random() - 0.5) * 0.005;
            const lngOffset = (Math.random() - 0.5) * 0.005;
            marker = L.marker([-0.395 + latOffset, 36.680 + lngOffset]).addTo(map);
            marker.bindPopup("<b>Threat Detected!</b>").openPopup();
        }

        function resetUI() {
            document.getElementById('status-text').className = "status-clear";
            document.getElementById('status-text').innerHTML = '<i class="fa-solid fa-check-circle"></i> AREA SECURE';
            document.getElementById('threat-details').style.display = "none";
            document.getElementById('snapshot-placeholder').style.display = "block";
            document.getElementById('snapshot-img').style.display = "none";
            document.getElementById('snapshot-img').src = "";
            document.getElementById('refresh-img-btn').style.display = "none";
            threatAlreadyLogged = false; 
            if (marker) map.removeLayer(marker);
        }

        function generateReport() {
            const time = document.getElementById('detected-time').innerText;
            const tool = document.getElementById('detected-tool').innerText;
            let imgSrc = document.getElementById('snapshot-img').src;
            
            if (document.getElementById('snapshot-img').style.display === "none" || !imgSrc) {
                imgSrc = "https://via.placeholder.com/640x480.png?text=No+Visual+Evidence+Available";
            }
            
            const locationArea = "Kereita Forest Reserve - Sector 4";
            const locationCoords = "-0.395, 36.680";
            const date = new Date().toLocaleDateString();

            const reportWindow = window.open('', '_blank', 'width=800,height=900');

            reportWindow.document.write(`
                <!DOCTYPE html>
                <html>
                <head>
                    <title>Incident Report - ${date}</title>
                    <style>
                        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; padding: 40px; color: #000; }
                        .header { text-align: center; border-bottom: 3px solid #d32f2f; padding-bottom: 20px; margin-bottom: 30px; }
                        .header h1 { margin: 0; color: #d32f2f; font-size: 24px; letter-spacing: 1px; }
                        .header p { margin: 5px 0 0 0; color: #555; font-size: 14px; text-transform: uppercase; }
                        .content { margin-bottom: 30px; }
                        .data-row { margin-bottom: 12px; font-size: 14px; }
                        .label { font-weight: bold; width: 180px; display: inline-block; color: #333; }
                        .highlight { color: #d32f2f; font-weight: bold; text-transform: uppercase; }
                        .evidence-box { border: 2px dashed #999; padding: 15px; text-align: center; margin-top: 20px; }
                        .evidence-box h3 { margin-top: 0; color: #333; font-size: 16px; }
                        .evidence-box img { max-width: 100%; height: auto; border: 1px solid #000; }
                        .footer { margin-top: 50px; text-align: center; font-size: 11px; color: #777; border-top: 1px solid #ccc; padding-top: 15px; }
                    </style>
                </head>
                <body>
                    <div class="header">
                        <h1>OFFICIAL INCIDENT REPORT</h1>
                        <p>Automated Forest Security & Conservation System</p>
                    </div>
                    
                    <div class="content">
                        <div class="data-row"><span class="label">Date of Report:</span> ${date}</div>
                        <div class="data-row"><span class="label">Time of Detection:</span> ${time}</div>
                        <div class="data-row"><span class="label">Threat Classification:</span> <span class="highlight">${tool}</span></div>
                        <div class="data-row"><span class="label">Assigned Sector:</span> ${locationArea}</div>
                        <div class="data-row"><span class="label">GPS Coordinates:</span> ${locationCoords}</div>
                    </div>
                    
                    <div class="evidence-box">
                        <h3>CONFIRMED VISUAL EVIDENCE</h3>
                        <img src="${imgSrc}" alt="Threat Evidence">
                    </div>
                    
                    <div class="footer">
                        Generated automatically by the Edge-Compute AI Node.<br>
                        This document serves as preliminary evidence for dispatch and local law enforcement.
                    </div>
                </body>
                </html>
            `);

            reportWindow.document.close();

            setTimeout(() => {
                reportWindow.focus();
                reportWindow.print();
            }, 500);
        }

        setInterval(updateDashboard, 500);
    </script>
</body>
</html>
